<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NestHub 快捷收藏</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header>
    <img class="brand-icon" src="icons/icon-48.png" alt="">
    <div class="brand"><div class="brand-name">NestHub</div><h1>快捷收藏</h1></div>
    <button id="disconnect" hidden type="button">断开连接</button>
  </header>
  <p id="status" role="status" aria-live="polite">正在读取当前网页…</p>
  <form id="connectionForm" hidden>
    <p class="connection-heading">连接你的导航空间</p>
    <p class="connection-description">填写站点地址与 API 令牌，开始收藏。</p>
    <label for="site">站点地址</label><input id="site" type="url" placeholder="https://nav.example.com" required>
    <button id="connectFromSite" type="button" class="settings-save login-connect">使用网站登录状态连接</button>
    <small>读取此地址下已登录的 NestHub 页面，无需复制令牌。</small>
    <label for="token">API 令牌</label><input id="token" type="password" placeholder="粘贴从 NestHub 后台复制的令牌" autocomplete="off" spellcheck="false" required>
    <small>在 NestHub 后台「API 调用说明」中复制令牌，无需填写账号密码。</small>
    <div class="save-actions"><button class="primary-button" type="submit">验证并连接 <span aria-hidden="true">→</span></button></div>
  </form>
  <form id="saveForm" hidden>
    <p id="space"></p>
    <label for="title">网页标题</label><input id="title" maxlength="120" required>
    <label for="url">网页地址</label><input id="url" type="url" maxlength="1024" required>
    <div class="category-heading"><label for="category">保存到分类</label><button id="refresh" type="button" title="强制从 NestHub 获取最新分类">刷新分类</button></div>
    <select id="category" required></select>
    <details class="extra-options">
      <summary>添加描述和标签</summary>
      <label for="description">描述</label><textarea id="description" maxlength="500" rows="2" placeholder="记下收藏这页的理由"></textarea>
      <label for="tags">标签</label><input id="tags" maxlength="255" placeholder="多个标签用逗号分隔">
    </details>
    <label class="inline"><input id="pinned" type="checkbox">置顶到我的导航</label>
    <div class="save-actions"><button class="primary-button" id="save" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z"/></svg>添加到 NestHub</button></div>
  </form>
  <details class="settings">
    <summary>插件设置</summary>
    <label for="theme">插件主题</label>
    <select id="theme">
      <option value="default2">经典 · 简洁导航</option>
      <option value="ocean">海洋 · 蔚蓝清爽</option>
      <option value="neon">霓虹 · 未来科技</option>
      <option value="paper">纸笺 · 温润书卷</option>
      <option value="lime">青柠 · 清新</option>
      <option value="directory">网址簿 · 经典目录</option>
      <option value="workspace">效率台 · 侧栏工作台</option>
      <option value="launchpad">起始页 · 极简导航</option>
      <option value="blackgold">曜金 · 高级黑金</option>
      <option value="liquid">流光 · 液态玻璃</option>
    </select>
    <small id="themeDescription" class="theme-description" aria-live="polite"></small>
    <label class="inline"><input id="openOnStartup" type="checkbox">启动浏览器时打开导航</label>
    <label for="startupUrl">导航地址</label>
    <input id="startupUrl" type="url" placeholder="https://nav.example.com" autocomplete="off">
    <button id="saveStartup" type="button" class="settings-save">保存启动设置</button>
    <small>默认使用连接的站点地址；也可填写其他导航页。每次启动浏览器时打开一次。</small>
    <label class="inline"><input id="floating" type="checkbox">在网页上显示贴边收藏按钮</label>
    <small>开启时需授权网页访问；拖动可调整位置，取消勾选即可关闭。</small>
  </details>
  <footer>你的收藏，只发送到你连接的 NestHub</footer>
  <script src="popup.js" type="module"></script>
</body></html>
