name: Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Icon and database copy checks
        run: dotnet run --project tests/NestHub.SmokeTests -c Release -p:SkipFrontendBuild=true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nesthub:smoke
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke
      - name: Start Compose and check website and extension
        shell: bash
        run: |
          umask 077
          {
            echo 'NESTHUB_IMAGE=nesthub:smoke'
            echo 'ADMIN_EMAIL=ci@example.com'
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 24)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
          mkdir -p data/app
          sudo chown 1654:1654 data/app
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 300
          set -a
          source .env
          set +a
          python3 scripts/check-api.py --seed --snapshot /tmp/sqlite-api.json
          curl --fail http://localhost:5186/health
          curl --fail http://localhost:5186/ | grep -q 'id="app"'
          curl --fail http://localhost:5186/downloads/nesthub-extension.zip -o /tmp/extension.zip
          unzip -t /tmp/extension.zip
          docker compose exec -T nesthub sh -c 'echo persistent > /app/AppData/ci-persistence'
          docker compose up -d --force-recreate nesthub --wait --wait-timeout 300
          docker compose exec -T nesthub sh -c 'test "$(cat /app/AppData/ci-persistence)" = persistent'
          python3 scripts/check-api.py --snapshot /tmp/sqlite-api.json
          docker compose down
      - name: MySQL startup and migration to SQLite
        shell: bash
        run: |
          set -a
          source .env
          set +a
          docker compose -f docker-compose.mysql.yml up -d --wait --wait-timeout 300
          python3 scripts/check-api.py --seed --snapshot /tmp/mysql-api.json
          docker compose -f docker-compose.mysql.yml stop nesthub
          docker compose -f docker-compose.mysql.yml run --rm --no-deps \
            -e "Migration__MySqlConnectionString=Server=mysql;Database=nesthub;User ID=nesthub;Password=$MYSQL_PASSWORD;SslMode=None;" \
            -e Migration__SqlitePath=/app/AppData/migrated.db \
            nesthub --migrate-mysql-to-sqlite
          docker compose -f docker-compose.mysql.yml down
          printf '%s\n' 'services:' '  nesthub:' '    environment:' '      Database__ConnectionString: "Data Source=/app/AppData/migrated.db"' > /tmp/migrated.yml
          docker compose -f docker-compose.yml -f /tmp/migrated.yml up -d --wait --wait-timeout 300
          python3 scripts/check-api.py --snapshot /tmp/mysql-api.json
      - name: Single-container self update preserves data
        shell: bash
        run: |
          docker run -d --name nesthub-ci-registry -p 127.0.0.1:5000:5000 registry:2
          docker tag nesthub:smoke localhost:5000/nesthub-ci:latest
          for attempt in 1 2 3 4 5; do docker push localhost:5000/nesthub-ci:latest && break; sleep 2; done
          NESTHUB_IMAGE=localhost:5000/nesthub-ci:latest docker compose -f docker-compose.yml -f /tmp/migrated.yml up -d --wait --wait-timeout 300
          printf '%s\n' 'FROM nesthub:smoke' 'ENV NESTHUB_BUILD_REVISION=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' > /tmp/update.Dockerfile
          docker build -f /tmp/update.Dockerfile -t localhost:5000/nesthub-ci:latest .
          docker push localhost:5000/nesthub-ci:latest
          set -a
          source .env
          set +a
          python3 scripts/check-self-update.py
          python3 scripts/check-api.py --snapshot /tmp/mysql-api.json
          test "$(docker ps --filter name=nesthub-update-task --format '{{.ID}}')" = ''
      - name: Failure diagnostics
        if: failure()
        run: docker compose -f docker-compose.mysql.yml logs --tail=100
      - name: Cleanup
        if: always()
        run: |
          docker compose down
          docker compose -f docker-compose.mysql.yml down
          docker rm -f nesthub-ci-registry || true

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
